<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- « H » habillé en balise de code : <H>. Le H reste l'identité, les
       chevrons le rangent immédiatement dans la tête des développeurs. -->
  <text x="256" y="368"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="800">
    <tspan font-size="190" dy="-14" fill="#bfdbfe">&lt;</tspan>
    <tspan font-size="280" fill="#ffffff">H</tspan>
    <tspan font-size="190" dy="-14" fill="#bfdbfe">&gt;</tspan>
  </text>
</svg>
