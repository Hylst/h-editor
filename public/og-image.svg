<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="510" r="320" fill="url(#glow)"/>

  <!-- Editor window mock -->
  <g transform="translate(620, 110)">
    <rect x="0" y="0" width="500" height="380" rx="14" fill="#0c1117" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="38" rx="14" fill="#161b22"/>
    <rect x="0" y="24" width="500" height="14" fill="#161b22"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="19" r="6" fill="#10b981"/>
    <rect x="92" y="6" width="120" height="26" rx="6" fill="#0c1117" stroke="#1f2937" stroke-width="1"/>
    <text x="152" y="24" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">App.tsx</text>

    <g font-family="Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
      <g fill="#475569" text-anchor="end">
        <text x="32" y="74">1</text>
        <text x="32" y="98">2</text>
        <text x="32" y="122">3</text>
        <text x="32" y="146">4</text>
        <text x="32" y="170">5</text>
        <text x="32" y="194">6</text>
        <text x="32" y="218">7</text>
        <text x="32" y="242">8</text>
        <text x="32" y="266">9</text>
      </g>
      <text x="48" y="74" fill="#e2e8f0"><tspan fill="#c084fc">import </tspan>{ <tspan fill="#f59e0b">Editor</tspan> } <tspan fill="#c084fc">from </tspan><tspan fill="#86efac">'h-editor'</tspan>;</text>
      <text x="48" y="122" fill="#94a3b8">// Code in the browser.</text>
      <text x="48" y="146" fill="#94a3b8">// Your data stays yours.</text>
      <text x="48" y="194" fill="#e2e8f0"><tspan fill="#c084fc">const </tspan><tspan fill="#60a5fa">app </tspan>= () =&gt; (</text>
      <text x="64" y="218" fill="#e2e8f0">&lt;<tspan fill="#f87171">Editor</tspan> <tspan fill="#fbbf24">theme</tspan>=<tspan fill="#86efac">"zen"</tspan> <tspan fill="#fbbf24">local</tspan> /&gt;</text>
      <text x="48" y="242" fill="#e2e8f0">);</text>
      <text x="48" y="290" fill="#94a3b8">// hylst.fr/heditor</text>
    </g>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="url(#accent)"/>
    <text x="36" y="51" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="800" fill="#ffffff">H</text>
  </g>

  <!-- Headline -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="248" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-3">H Editor</text>
    <text x="80" y="300" font-size="30" font-weight="500" fill="#cbd5e1">L'éditeur de code dans votre navigateur</text>
    <text x="80" y="344" font-size="20" font-weight="400" fill="#94a3b8">React · Monaco · 40+ langages · 100 % local · sans tracking</text>
  </g>

  <!-- Feature badges -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500">
    <g transform="translate(80, 400)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#fbbf24"/>
      <text x="40" y="27" fill="#e2e8f0">Ultra rapide</text>
    </g>
    <g transform="translate(275, 400)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#10b981"/>
      <text x="40" y="27" fill="#e2e8f0">Local-first</text>
    </g>
    <g transform="translate(470, 400)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="22" cy="21" r="5" fill="#60a5fa"/>
      <text x="40" y="27" fill="#e2e8f0">Sans compte</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="80" y="552" font-size="22" font-weight="700" fill="#60a5fa">hylst.fr/heditor</text>
    <text x="80" y="582" font-size="15" font-weight="400" fill="#64748b">par Geoffroy Streit  ·  open source  ·  MIT</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="616" width="1200" height="14" fill="url(#accent)"/>
</svg>
