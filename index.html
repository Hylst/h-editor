<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H Editor - Éditeur de code en ligne gratuit | 40+ langages</title>
    <meta name="description" content="H Editor est un éditeur de code 100% front-end, né sur smartphone. Coloration syntaxique pour 40+ langages, preview Markdown, raccourcis VSCode, sauvegarde locale et export ZIP. Gratuit et sans inscription." />
    <meta name="author" content="Geoffroy Streit" />
    <meta name="keywords" content="éditeur de code, code editor, Monaco Editor, IDE en ligne, JavaScript, TypeScript, Python, PHP, Markdown, développement web, programmation" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1419" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://hylst.fr/app/" />
    <!-- manifest injecté par vite-plugin-pwa au build -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <!-- `mobile-web-app-capable` (standard moderne) ; l'ancienne forme `apple-` est dépréciée
         par Chrome. Le style de barre de statut iOS reste spécifique à Safari. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- JetBrains Mono est auto-hébergée (src/styles/fonts.css) : aucun appel réseau tiers. -->

    <!-- Open Graph -->
    <meta property="og:title" content="H Editor - Éditeur de code en ligne gratuit" />
    <meta property="og:description" content="Éditeur de code 100% front-end avec coloration syntaxique, preview Markdown et raccourcis VSCode." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hylst.fr/app/" />
    <meta property="og:image" content="https://hylst.fr/app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="H Editor — éditeur de code dans votre navigateur" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="H Editor" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hylst" />
    <meta name="twitter:title" content="H Editor - Éditeur de code en ligne gratuit" />
    <meta name="twitter:description" content="Éditeur de code 100% local avec Monaco Editor, 40+ langages supportés." />
    <meta name="twitter:image" content="https://hylst.fr/app/og-image.png" />
    <meta name="twitter:image:alt" content="H Editor — éditeur de code dans votre navigateur" />
    <meta name="twitter:creator" content="@hylst" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "H Editor",
      "description": "Éditeur de code 100% local avec coloration syntaxique pour 40+ langages",
      "url": "https://hylst.fr/app/",
      "image": "https://hylst.fr/app/og-image.png",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires modern browser with ES2020 support",
      "softwareVersion": "__APP_VERSION__",
      "inLanguage": "fr",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "author": {
        "@type": "Person",
        "name": "Geoffroy Streit",
        "email": "geoffroy.streit@gmail.com",
        "url": "https://hylst.fr"
      },
      "publisher": {
        "@type": "Person",
        "name": "Geoffroy Streit",
        "url": "https://hylst.fr"
      },
      "license": "https://opensource.org/licenses/MIT",
      "featureList": [
        "Monaco Editor",
        "40+ programming languages",
        "Markdown preview",
        "VSCode shortcuts",
        "Local storage",
        "ZIP export/import"
      ]
    }
    </script>
  </head>

  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #e5e7eb; background: #0f1419;">
        <h1>H Editor nécessite JavaScript</h1>
        <p>
          H Editor est un éditeur de code qui s'exécute entièrement dans votre navigateur.
          Activez JavaScript pour l'utiliser — aucune donnée n'est envoyée à un serveur.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
